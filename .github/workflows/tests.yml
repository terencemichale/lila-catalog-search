name: Python checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Compare JSON and SQLite search (synthetic data)
        run: |
          python -m scripts.benchmark_search --rows 1000 --repeats 30
          python -m scripts.benchmark_search --rows 10000 --repeats 30
